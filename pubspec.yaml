name: b_flutter
description: "High-performance clean-room refactor of the legacy application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  adaptive_dialog: ^2.1.0
  chewie: ^1.8.2
  flutter:
    sdk: flutter
  bot_toast: ^4.1.3
  cached_network_image: ^3.4.1
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  encrypt: ^5.0.3
  flutter_easyloading: ^3.0.5
  flutter_inappwebview: 6.0.0
  flutter_svg: ^2.2.0
  flutter_spinkit: ^5.2.1
  flutter_volume_controller: ^2.0.2
  flutter_widget_from_html: ^0.16.1
  fanjiao_danmu: ^0.5.6
  get: ^4.7.3
  html_editor_enhanced: 2.6.0
  logger: ^2.7.0
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.2
  package_info_plus: ^9.0.1
  screen_brightness: ^2.1.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

# Keep the rich-text editor and its WebView wrapper on the versions locked by
# the legacy project. Android build compatibility is handled in the workspace
# Gradle configuration without changing their runtime interaction behavior.
dependency_overrides:
  flutter_inappwebview: 6.0.0
  flutter_inappwebview_android: 1.1.3
  flutter_inappwebview_ios: 1.0.13
  flutter_inappwebview_macos: 1.0.11
  flutter_inappwebview_platform_interface: 1.3.0+1
  flutter_inappwebview_web: 1.0.8
  wakelock_plus: 1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/navi/
    - assets/images/v1/
