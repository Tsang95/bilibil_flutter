name: b_flutter
description: "High-performance clean-room refactor of the legacy application."
publish_to: 'none'
version: 1.3.1+131

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  adaptive_dialog: 2.1.0
  chewie: 1.8.4
  flutter:
    sdk: flutter
  bot_toast: ^4.1.3
  cached_network_image: ^3.4.1
  carousel_slider: 5.0.0
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  encrypt: ^5.0.3
  flutter_easyloading: ^3.0.5
  flutter_inappwebview: 6.0.0
  flutter_svg: 2.0.16
  flutter_spinkit: 5.2.1
  flutter_screenutil: ^5.9.3
  flutter_widget_from_html: ^0.16.1
  fanjiao_danmu: 0.5.6
  fl_chart: 0.69.2
  get: ^4.7.3
  html_editor_enhanced: 2.6.0
  logger: ^2.7.0
  image_picker: ^1.1.2
  image_gallery_saver_plus: 3.0.5
  mobile_scanner: 6.0.2
  package_info_plus: 8.1.0
  pinput: 5.0.0
  permission_handler: 11.3.1
  qr_flutter: ^4.1.0
  screen_brightness: 2.1.1
  shared_preferences: 2.2.3
  url_launcher: ^6.3.0
  video_player: 2.9.1
  volume_controller: 3.3.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

# Keep the rich-text editor and its WebView wrapper on the versions locked by
# the legacy project. Android build compatibility is handled in the workspace
# Gradle configuration without changing their runtime interaction behavior.
dependency_overrides:
  flutter_inappwebview: 6.0.0
  flutter_inappwebview_android: 1.0.13
  flutter_inappwebview_ios: 1.0.13
  flutter_inappwebview_macos: 1.0.11
  flutter_inappwebview_platform_interface: 1.0.10
  flutter_inappwebview_internal_annotations: 1.1.1
  flutter_inappwebview_web: 1.0.8
  dynamic_color: 1.7.0
  macos_ui: 2.0.7
  screen_brightness_android: 2.1.0
  screen_brightness_ios: 2.1.1
  screen_brightness_macos: 2.1.1
  screen_brightness_platform_interface: 2.1.0
  screen_brightness_windows: 2.1.0
  video_player_android: 2.7.1
  video_player_avfoundation: 2.6.1
  video_player_platform_interface: 6.2.2
  video_player_web: 2.3.2
  wakelock_plus: 1.2.8
  wakelock_plus_platform_interface: 1.2.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/navi/
    - assets/images/v1/
